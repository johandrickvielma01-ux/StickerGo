name: Build StickerGo Android Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "StickerGo_V4_6_3_BETA2_ANDROID_BUILD_FIXED_v3.zip"
      - ".github/workflows/build-aar.yml"

jobs:
  build-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V3 ZIP
        run: |
          echo "=== ZIP seleccionado ==="
          ls -lh StickerGo_V4_6_3_BETA2_ANDROID_BUILD_FIXED_v3.zip

      - name: Extract StickerGo V3
        run: |
          rm -rf stickergo
          mkdir -p stickergo

          unzip -q \
            StickerGo_V4_6_3_BETA2_ANDROID_BUILD_FIXED_v3.zip \
            -d stickergo

          echo "=== Proyecto extraído ==="
          find stickergo/android/plugin -maxdepth 5 -type f | sort | head -200

      - name: Verify corrected Kotlin source
        run: |
          FILE=$(find stickergo/android/plugin \
            -name "StickerGoTikTokPlugin.kt" | head -1)

          echo "========================================"
          echo "Kotlin encontrado:"
          echo "$FILE"
          echo "========================================"

          echo ""
          echo "=== Verificando import AuthRequest ==="

          grep -q \
            "import com.tiktok.open.sdk.auth.AuthRequest" \
            "$FILE"

          echo "OK: AuthRequest correcto"

          echo ""
          echo "=== Verificando import antiguo auth.model ==="

          if grep -q \
            "import com.tiktok.open.sdk.auth.model.AuthRequest" \
            "$FILE"; then

            echo "ERROR: todavía existe auth.model.AuthRequest"
            exit 1
          fi

          echo "OK: no existe auth.model.AuthRequest"

          echo ""
          echo "=== Verificando onMainNewIntent ==="

          if grep -q \
            "onMainNewIntent" \
            "$FILE"; then

            echo "ERROR: todavía existe onMainNewIntent"
            exit 1
          fi

          echo "OK: no existe onMainNewIntent"

          echo ""
          echo "=== Verificando authMsg REAL ==="

          # Solo buscamos el uso real de response.authMsg.
          # No buscamos la palabra general porque puede aparecer
          # dentro de comentarios.

          if grep -q \
            "response\.authMsg" \
            "$FILE"; then

            echo "ERROR: todavía existe response.authMsg"
            exit 1
          fi

          echo "OK: no existe response.authMsg"

          echo ""
          echo "========================================"
          echo "KOTLIN V3 VALIDADO CORRECTAMENTE"
          echo "========================================"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify AndroidX
        working-directory: stickergo/android/plugin
        run: |
          echo "=== gradle.properties ==="
          cat gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties
          grep -q "android.enableJetifier=true" gradle.properties

          echo ""
          echo "AndroidX OK"

      - name: Build StickerGoTikTok AAR
        working-directory: stickergo/android/plugin
        run: |
          echo "=== Gradle version ==="
          gradle --version

          echo ""
          echo "========================================"
          echo "COMPILANDO StickerGoTikTok-release.aar"
          echo "========================================"

          gradle :plugin:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find generated AAR
        run: |
          echo "========================================"
          echo "AAR GENERADOS"
          echo "========================================"

          find stickergo \
            -type f \
            -name "*.aar" \
            -print

      - name: Verify release AAR
        run: |
          AAR=$(find stickergo \
            -type f \
            -name "StickerGoTikTok-release.aar" | head -1)

          if [ -z "$AAR" ]; then
            echo ""
            echo "ERROR: No se encontró StickerGoTikTok-release.aar"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "🔥 AAR ENCONTRADO 🔥"
          echo "========================================"
          echo "$AAR"
          echo ""

          ls -lh "$AAR"

      - name: Upload StickerGoTikTok AAR
        uses: actions/upload-artifact@v4
        with:
          name: StickerGoTikTok-AAR
          path: |
            stickergo/**/StickerGoTikTok-release.aar
          if-no-files-found: error
