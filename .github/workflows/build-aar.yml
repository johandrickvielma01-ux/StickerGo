name: Build StickerGo Android Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "StickerGo_V4_6_4_BETA_SOURCE.zip"
      - ".github/workflows/build-aar.yml"

jobs:
  build-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V4.6.4 source ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'StickerGo_V4_6_4_BETA_SOURCE.zip' \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: StickerGo_V4_6_4_BETA_SOURCE.zip no encontrado."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract StickerGo V4.6.4
        shell: bash
        run: |
          set -e

          rm -rf stickergo
          mkdir -p stickergo

          unzip -q "${{ steps.project.outputs.zip }}" -d stickergo

          echo "================================"
          echo "PROYECTO STICKERGO EXTRAÍDO"
          echo "================================"

          find stickergo/android/plugin -maxdepth 5 -type f | sort | head -100

      - name: Verify Kotlin source
        shell: bash
        run: |
          set -e

          FILE="stickergo/android/plugin/plugin/src/main/java/com/stickergo/tiktok/StickerGoTikTokPlugin.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: No se encontró StickerGoTikTokPlugin.kt"
            exit 1
          fi

          echo "================================"
          echo "VERIFICANDO PLUGIN V4.6.4"
          echo "================================"

          echo "--- onMainResume ---"
          grep -n "onMainResume" "$FILE" || {
            echo "ERROR: onMainResume no encontrado."
            exit 1
          }

          echo "--- ACTION_VIEW ---"
          grep -n "ACTION_VIEW" "$FILE" || {
            echo "ERROR: ACTION_VIEW no encontrado."
            exit 1
          }

          echo "--- callback URL ---"
          grep -n "johandrickvielma01-ux.github.io/tiktok/callback" "$FILE" || true

          echo "OK: código Kotlin encontrado."

      - name: Verify TikTok imports
        shell: bash
        run: |
          set -e

          FILE="stickergo/android/plugin/plugin/src/main/java/com/stickergo/tiktok/StickerGoTikTokPlugin.kt"

          echo "Verificando AuthRequest..."

          grep -q 'import com.tiktok.open.sdk.auth.AuthRequest' "$FILE" || {
            echo "ERROR: AuthRequest incorrecto o faltante."
            exit 1
          }

          echo "OK: AuthRequest correcto."

          if grep -q 'import com.tiktok.open.sdk.auth.model.AuthRequest' "$FILE"; then
            echo "ERROR: todavía existe auth.model.AuthRequest"
            exit 1
          fi

          echo "OK: no existe el import antiguo."

      - name: Verify no unsupported onMainNewIntent
        shell: bash
        run: |
          set -e

          FILE="stickergo/android/plugin/plugin/src/main/java/com/stickergo/tiktok/StickerGoTikTokPlugin.kt"

          if grep -q 'onMainNewIntent' "$FILE"; then
            echo "ERROR: onMainNewIntent todavía existe."
            exit 1
          fi

          echo "OK: no existe onMainNewIntent."

      - name: Verify callback processing
        shell: bash
        run: |
          set -e

          FILE="stickergo/android/plugin/plugin/src/main/java/com/stickergo/tiktok/StickerGoTikTokPlugin.kt"

          echo "Verificando procesamiento del callback..."

          grep -q 'Intent.ACTION_VIEW' "$FILE" || {
            echo "ERROR: Intent.ACTION_VIEW no encontrado."
            exit 1
          }

          grep -q 'getAuthResponseFromIntent' "$FILE" || {
            echo "ERROR: getAuthResponseFromIntent no encontrado."
            exit 1
          }

          grep -q 'onMainResume' "$FILE" || {
            echo "ERROR: onMainResume no encontrado."
            exit 1
          }

          echo "OK: callback preparado."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify AndroidX
        working-directory: stickergo/android/plugin
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "VERIFICANDO ANDROIDX"
          echo "================================"

          grep -q 'android.useAndroidX=true' gradle.properties || {
            echo "ERROR: android.useAndroidX=true no encontrado."
            exit 1
          }

          grep -q 'android.enableJetifier=true' gradle.properties || {
            echo "ERROR: android.enableJetifier=true no encontrado."
            exit 1
          }

          echo "AndroidX OK."

      - name: Build release and debug AAR
        working-directory: stickergo/android/plugin
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "COMPILANDO STICKERGO V4.6.4"
          echo "================================"

          gradle --version

          gradle \
            :plugin:assembleRelease \
            :plugin:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify generated AARs
        shell: bash
        run: |
          set -e

          RELEASE="stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-release.aar"
          DEBUG="stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-debug.aar"

          echo "================================"
          echo "VERIFICANDO AAR GENERADOS"
          echo "================================"

          if [ ! -f "$RELEASE" ]; then
            echo "ERROR: release AAR no encontrado."
            exit 1
          fi

          if [ ! -f "$DEBUG" ]; then
            echo "ERROR: debug AAR no encontrado."
            exit 1
          fi

          echo "Release:"
          ls -lh "$RELEASE"

          echo "Debug:"
          ls -lh "$DEBUG"

          echo "AARs generados correctamente."

      - name: Copy fresh AARs into Godot project
        shell: bash
        run: |
          set -e

          mkdir -p stickergo/addons/StickerGoTikTok/bin/release
          mkdir -p stickergo/addons/StickerGoTikTok/bin/debug

          cp \
            stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-release.aar \
            stickergo/addons/StickerGoTikTok/bin/release/StickerGoTikTok-release.aar

          cp \
            stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-debug.aar \
            stickergo/addons/StickerGoTikTok/bin/debug/StickerGoTikTok-debug.aar

          echo "================================"
          echo "AAR ACTUALIZADOS EN GODOT"
          echo "================================"

          ls -lh stickergo/addons/StickerGoTikTok/bin/release/
          ls -lh stickergo/addons/StickerGoTikTok/bin/debug/

      - name: Verify AAR contains plugin classes
        shell: bash
        run: |
          set -e

          RELEASE="stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-release.aar"

          echo "================================"
          echo "VERIFICANDO CLASES DEL PLUGIN"
          echo "================================"

          if [ ! -f "$RELEASE" ]; then
            echo "ERROR: Release AAR no encontrado."
            exit 1
          fi

          echo "Extrayendo classes.jar..."

          rm -rf /tmp/stickergo_aar_check
          mkdir -p /tmp/stickergo_aar_check

          unzip -oq "$RELEASE" \
            "classes.jar" \
            -d /tmp/stickergo_aar_check

          if [ ! -f "/tmp/stickergo_aar_check/classes.jar" ]; then
            echo "ERROR: classes.jar no encontrado dentro del AAR."
            exit 1
          fi

          echo "classes.jar encontrado."

          echo "Buscando StickerGoTikTokPlugin.class..."

          if unzip -l "/tmp/stickergo_aar_check/classes.jar" \
            | grep -q "StickerGoTikTokPlugin.class"; then

            echo ""
            echo "================================"
            echo "🔥 PLUGIN ENCONTRADO 🔥"
            echo "================================"

          else
            echo "ERROR: StickerGoTikTokPlugin.class no encontrado."
            echo ""
            echo "Contenido de classes.jar:"
            unzip -l "/tmp/stickergo_aar_check/classes.jar"
            exit 1
          fi

      - name: Package ready-to-export project
        shell: bash
        run: |
          set -e

          cd stickergo

          zip -qr ../StickerGo_V4_6_4_BETA_READY.zip .

          cd ..

          echo "================================"
          echo "PROYECTO FINAL GENERADO"
          echo "================================"

          ls -lh StickerGo_V4_6_4_BETA_READY.zip

      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: StickerGoTikTok-AAR-V4.6.4
          path: |
            stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-release.aar
            stickergo/android/plugin/plugin/build/outputs/aar/StickerGoTikTok-debug.aar
          if-no-files-found: error

      - name: Upload ready-to-export Godot project
        uses: actions/upload-artifact@v4
        with:
          name: StickerGo-V4.6.4-BETA-READY
          path: StickerGo_V4_6_4_BETA_READY.zip
          if-no-files-found: error
